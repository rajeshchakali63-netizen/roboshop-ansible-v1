- name: configure mysql server
  hosts: mysql
  become: yes
  tasks:
  - name: enable mysql 8.4
    command: dnf module enable mysql:8.4 -y


  - name: install mysql server
    ansible.builtin.dnf:
      name: mysql-server
      state: present

  - name: enabel and start mysql
    service:
      name: mysqld
      state: started
      enabled: true

  